<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lir</title>
        <meta
            name="description"
            content="Modern, minimalist open-source Soundpad alternative web and desktop application built with React and Web Audio API with virtual cable routing and hotkeys."
        />
        <meta property="og:title" content="Lir" />
        <meta
            property="og:description"
            content="Modern, minimalist open-source Soundpad alternative web and desktop application built with React and Web Audio API with virtual cable routing and hotkeys."
        />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="icon" type="image/x-icon" href="./assets/img/icon.ico" />
        <link rel="icon" type="image/png" href="./assets/img/icon.png?v=1.3" />
        <link rel="apple-touch-icon" href="./assets/img/icon.png?v=1.3" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <script>
            (function () {
                try {
                    var saved = localStorage.getItem("lir_theme_v1");
                    var prefersDark =
                        window.matchMedia &&
                        window.matchMedia("(prefers-color-scheme: dark)").matches;
                    var resolved =
                        saved === "amoled" || saved === "dark" || saved === "light"
                            ? saved
                            : prefersDark
                              ? "dark"
                              : "light";
                    document.documentElement.dataset.theme = resolved;
                    document.documentElement.classList.remove("amoled", "dark", "light");
                    document.documentElement.classList.add(resolved);
                } catch (e) {}
            })();
        </script>
    </head>
    <body
        class="antialiased overflow-hidden"
    >
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
