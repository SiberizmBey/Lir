<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <title>Spotify Yetkilendirme</title>
        <style>
            body {
                background: #09090b;
                color: #fafafa;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
            }
            .box {
                background: #18181b;
                border: 1px solid #27272a;
                border-radius: 12px;
                padding: 24px 32px;
                text-align: center;
                max-width: 380px;
            }
            h2 {
                margin: 0 0 8px 0;
                font-size: 16px;
                color: #1db954;
            }
            p {
                margin: 0;
                font-size: 13px;
                color: #a1a1aa;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <h2 id="heading">Spotify Bağlantısı Başarılı</h2>
            <p id="sub">
                Pencere kapatılıyor ve Lir uygulamasına aktarılıyor...
            </p>
        </div>
        <script>
            (function () {
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get("code");
                const error = urlParams.get("error");
                const state = urlParams.get("state");

                if (error) {
                    document.getElementById("heading").innerText =
                        "Bağlantı Başarısız";
                    document.getElementById("heading").style.color = "#f87171";
                    document.getElementById("sub").innerText =
                        "Yetkilendirme reddedildi veya bir hata oluştu.";
                }

                if (window.opener) {
                    window.opener.postMessage(
                        {
                            type: error
                                ? "OAUTH_AUTH_ERROR"
                                : "OAUTH_AUTH_SUCCESS",
                            code: code || "",
                            error: error || "",
                            state: state || "",
                        },
                        "*",
                    );
                    setTimeout(() => window.close(), 600);
                } else {
                    setTimeout(() => {
                        window.location.href = "/";
                    }, 1000);
                }
            })();
        </script>
    </body>
</html>
